kind = "web"
previewPath = "/"
title = "Testmedaddy"
description = "Independent peptide testing pools: host, share, pay, publish."
version = "1.0.0"
id = "artifacts/testmedaddy"
router = "path"

[[services]]
localPort = 21505
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/testmedaddy run dev"

[services.env]
PORT = "21505"
BASE_PATH = "/"
API_PORT = "8080"

[services.production]
build = ["pnpm", "--filter", "@workspace/testmedaddy", "run", "build"]
publicDir = "artifacts/testmedaddy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
