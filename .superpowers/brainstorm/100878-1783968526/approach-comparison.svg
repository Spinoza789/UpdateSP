    <text x="25" y="430" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d1d1f">A — Faithful shell</text>
    <text x="25" y="464" font-family="Arial, sans-serif" font-size="17" fill="#68686f">Rebuild the sidebar, top bar, typography,</text>
    <text x="25" y="489" font-family="Arial, sans-serif" font-size="17" fill="#68686f">borders, cards, spacing and density from the</text>
    <text x="25" y="514" font-family="Arial, sans-serif" font-size="17" fill="#68686f">reference. Keep each group-buy screen’s purpose.</text>
    <rect x="25" y="552" width="154" height="34" rx="17" fill="#242427"/>
    <text x="43" y="575" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">RECOMMENDED</text>
  </g>

