    <text x="25" y="464" font-family="Arial, sans-serif" font-size="17" fill="#68686f">Keep the current layout and update only tokens,</text>
    <text x="25" y="489" font-family="Arial, sans-serif" font-size="17" fill="#68686f">fonts, radii and colors. Fastest, but misses the</text>
    <text x="25" y="514" font-family="Arial, sans-serif" font-size="17" fill="#68686f">reference’s proportions, hierarchy and rhythm.</text>
    <rect x="25" y="552" width="154" height="34" rx="17" fill="#efeff1"/>
    <text x="43" y="575" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#444449">LOW DISRUPTION</text>
