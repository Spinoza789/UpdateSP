    <text x="25" y="430" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d1d1f">B — Full structural remap</text>
    <text x="25" y="464" font-family="Arial, sans-serif" font-size="17" fill="#68686f">Force every screen into the reference’s analytics</text>
    <text x="25" y="489" font-family="Arial, sans-serif" font-size="17" fill="#68686f">and board composition. Visually literal, but makes</text>
    <text x="25" y="514" font-family="Arial, sans-serif" font-size="17" fill="#68686f">shipping, settings and forms less natural.</text>
    <rect x="25" y="552" width="168" height="34" rx="17" fill="#efeff1"/>
    <text x="43" y="575" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#444449">HIGH DISRUPTION</text>
