<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peps Anonymous — Connected Bento Dashboard</title>
  <style>
    :root { --navy:#1b3a7a; --blue:#2d6bcc; --ink:#0f1f38; --muted:#6b7280; --line:#d0dae4; --page:#edf3f8; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:radial-gradient(circle at 7% 0%,rgba(255,255,255,.9),transparent 27%),var(--page); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
    .preview-frame { display:block; width:100%; min-height:790px; border:0; background:transparent; }
    .review-panel { width:min(1508px,calc(100% - 38px)); display:flex; align-items:center; justify-content:space-between; gap:24px; margin:16px auto 44px; padding:16px 18px 16px 22px; border:1px solid rgba(27,58,122,.14); border-radius:22px; background:rgba(255,255,255,.92); box-shadow:0 10px 28px rgba(27,49,100,.07); }
    .review-panel b { display:block; font-size:12px; letter-spacing:-.025em; }
    .review-panel span { display:block; margin-top:4px; color:var(--muted); font-size:9px; }
    .review-actions { display:flex; gap:8px; }
    .review-actions button { min-height:39px; padding:0 15px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font-size:9px; font-weight:800; cursor:pointer; }
    .review-actions .primary { border-color:var(--navy); background:linear-gradient(135deg,var(--blue),var(--navy)); color:#fff; box-shadow:0 7px 16px rgba(27,58,122,.18); }
    .review-actions button.selected { outline:4px solid rgba(45,107,204,.2); }
    @media(max-width:720px){.review-panel{width:calc(100% - 20px);align-items:flex-start;flex-direction:column}.review-actions{width:100%}.review-actions button{flex:1}}
  </style>
</head>
<body>
  <iframe id="cards-preview" class="preview-frame" src="/files/ecomora-peps-compact-analytics-v3.html" title="Peps Anonymous connected bento card dashboard"></iframe>

  <section class="review-panel">
    <div><b>Connected bento card system</b><span>Shared tray, aligned card edges, consistent gutters, and perimeter-aware corner shapes.</span></div>
    <div class="review-actions">
      <button data-choice="revise-connected-bento" onclick="toggleSelect(this)">Request changes</button>
      <button class="primary" data-choice="approve-connected-bento" onclick="toggleSelect(this)">Approve card system</button>
    </div>
  </section>

  <script>
    const outerFrame = document.getElementById('cards-preview');

    function ensurePatch(doc, id, css) {
      if (!doc || doc.getElementById(id)) return;
      const style = doc.createElement('style');
      style.id = id;
      style.textContent = css;
      doc.head.appendChild(style);
    }

    function applyCardSystem() {
      const levelOneDoc = outerFrame.contentDocument;
      const levelTwoFrame = levelOneDoc?.getElementById('revision-preview');
      const levelTwoDoc = levelTwoFrame?.contentDocument;
      const levelThreeFrame = levelTwoDoc?.getElementById('branded-preview');
      const levelThreeDoc = levelThreeFrame?.contentDocument;
      const levelFourFrame = levelThreeDoc?.getElementById('dashboard-preview');
      const appDoc = levelFourFrame?.contentDocument;

      if (!levelOneDoc || !levelTwoFrame || !levelTwoDoc || !levelThreeFrame || !levelThreeDoc || !levelFourFrame || !appDoc?.head) return false;

      ensurePatch(levelOneDoc, 'bento-level-one', '.review-panel{display:none!important}.preview-frame{min-height:0!important}');
      ensurePatch(levelTwoDoc, 'bento-level-two', '.review-panel{display:none!important}.preview-frame{min-height:0!important}');
      ensurePatch(levelThreeDoc, 'bento-level-three', '.review-panel{display:none!important}.preview-frame{min-height:0!important}');

      if (!appDoc.querySelector('.bento-shell')) {
        const overview = appDoc.querySelector('.overview-grid');
        const lower = appDoc.querySelector('.lower-grid');
        if (overview && lower) {
          const shell = appDoc.createElement('div');
          shell.className = 'bento-shell';
          overview.parentNode.insertBefore(shell, overview);
          shell.append(overview, lower);
        }
      }

      ensurePatch(appDoc, 'connected-bento-theme', `
        .dashboard {
          padding:25px 25px 26px;
          border-radius:34px;
        }

        .dashboard-head { margin-bottom:19px; padding:0 5px; }

        .bento-shell {
          position:relative;
          padding:7px;
          overflow:hidden;
          border:1px solid rgba(27,58,122,.09);
          border-radius:29px;
          background:linear-gradient(145deg,#dfe8f2 0%,#eaf0f6 54%,#dce6f0 100%);
          box-shadow:
            inset 0 1px 0 rgba(255,255,255,.78),
            0 12px 28px rgba(27,49,100,.06);
        }

        .bento-shell::before {
          content:"";
          position:absolute;
          width:280px;
          height:280px;
          top:-150px;
          right:16%;
          border-radius:50%;
          background:rgba(45,107,204,.055);
          filter:blur(2px);
          pointer-events:none;
        }

        .overview-grid,
        .lower-grid { position:relative; z-index:1; gap:7px; }
        .metric-stack { gap:7px; }
        .lower-grid { margin-top:7px; }

        .card {
          border:1px solid rgba(27,58,122,.055);
          background:#fff;
          box-shadow:
            0 1px 1px rgba(27,49,100,.025),
            inset 0 1px 0 rgba(255,255,255,.74);
        }

        .metric-card {
          background:linear-gradient(145deg,#f9fbfe,#f2f7fc);
        }
        .metric-card:first-child { border-radius:21px 13px 13px 13px; }
        .metric-card:last-child { border-radius:13px 13px 13px 21px; }
        .metric-card::after { border-color:rgba(45,107,204,.06); }

        .revenue-card {
          border-radius:13px;
          background:linear-gradient(160deg,#ffffff 0%,#fbfdff 100%);
        }

        .status-card {
          border-radius:13px 21px 13px 13px;
          background:linear-gradient(145deg,#f8fbff,#f1f6fb);
        }

        .orders-card {
          min-height:290px;
          padding-top:18px;
          border-radius:13px 13px 13px 21px;
        }

        .products-card {
          min-height:290px;
          padding-top:18px;
          border-radius:13px 13px 21px 13px;
          background:linear-gradient(145deg,#f8fbff,#eef4f9);
        }

        .orders-table td { height:43px; }
        .top-product { margin-top:9px; }
        .product-list { margin-top:6px; }
        .product-row { padding-block:6px; }

        .period,
        .mini-search { background:rgba(255,255,255,.8); }

        @media(max-width:1180px){
          .status-card{border-radius:13px 13px 21px 21px}
          .orders-card{border-radius:21px 13px 13px 21px}
        }
        @media(max-width:820px){
          .bento-shell{padding:6px;border-radius:24px}
          .overview-grid,.lower-grid,.metric-stack{gap:6px}.lower-grid{margin-top:6px}
          .card,.metric-card:first-child,.metric-card:last-child,.revenue-card,.status-card,.orders-card,.products-card{border-radius:18px}
        }
      `);

      requestAnimationFrame(() => {
        levelFourFrame.style.height = `${appDoc.documentElement.scrollHeight}px`;
        requestAnimationFrame(() => {
          levelThreeFrame.style.height = `${levelThreeDoc.documentElement.scrollHeight}px`;
          requestAnimationFrame(() => {
            levelTwoFrame.style.height = `${levelTwoDoc.documentElement.scrollHeight}px`;
            requestAnimationFrame(() => {
              outerFrame.style.height = `${levelOneDoc.documentElement.scrollHeight}px`;
            });
          });
        });
      });
      return true;
    }

    function patchWhenReady(attempt = 0) {
      if (applyCardSystem() || attempt > 24) return;
      setTimeout(() => patchWhenReady(attempt + 1), 120);
    }

    outerFrame.addEventListener('load', () => patchWhenReady());
    window.addEventListener('resize', () => patchWhenReady());
  </script>
</body>
</html>
